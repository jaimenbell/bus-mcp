name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + README count-verification gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install (test extra)
        run: pip install -e ".[test]"

      # pyproject.toml's [tool.pytest.ini_options] already sets addopts = "-q";
      # --junitxml is unaffected by -q verbosity (it's a separate structured
      # report), so the count-gate below reads the junit report, never the
      # console summary line.
      - name: Run test suite
        run: python -m pytest --junitxml=junit.xml

      - name: README count-verification gate
        run: python scripts/check_readme_counts.py --readme README.md --junit-xml junit.xml

      # Dependency CVE scan. WARN-ONLY on purpose: this is the first run, so
      # the baseline is unknown -- gating now would block every build on
      # findings nobody has triaged yet.
      #
      # To gate later: drop continue-on-error, set exit-code to "1", and add
      # a .trivyignore entry for any accepted-risk CVE with a dated rationale.
      - name: Dependency vulnerability scan (warn-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "0"
