name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + README count-verification gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install (test extra)
        run: pip install -e ".[test]"

      # pyproject.toml's [tool.pytest.ini_options] already sets addopts = "-q";
      # --junitxml is unaffected by -q verbosity (it's a separate structured
      # report), so the count-gate below reads the junit report, never the
      # console summary line.
      - name: Run test suite
        run: python -m pytest --junitxml=junit.xml

      - name: README count-verification gate
        run: python scripts/check_readme_counts.py --readme README.md --junit-xml junit.xml

      # Dependency vulnerability scan. GATING on TWO independent conditions --
      # both required, condition 2 is the reason this block exists:
      #   (1) any HIGH/CRITICAL vulnerability found -- trivy's own exit-code
      #       mechanism (exit-code: "1" + severity: HIGH,CRITICAL).
      #   (2) trivy resolved ZERO scan targets -- trivy's pip analyzer
      #       silently SKIPS manifests it cannot resolve to concrete
      #       versions. A sibling repo (video-digest) had a fully unpinned
      #       requirements.txt: trivy printed a clean, empty-looking table
      #       and the job reported GREEN having scanned absolutely nothing.
      #       A gate that only fails on findings is fully satisfied by a
      #       scan that found nothing because it parsed nothing -- condition
      #       (2) is what makes condition (1) mean something. Verified
      #       2026-07-30: this repo's requirements.txt DOES parse (1 pip
      #       target, 0 HIGH/CRITICAL findings), so gating breaks nothing.
      #
      # Kept as separate, distinctly-named steps below so a red build tells
      # you immediately which condition fired -- "found a CVE" and "the
      # scanner went blind" demand completely different responses.
      - name: "Dependency scan: HIGH/CRITICAL vulnerabilities (gate 1, human-readable)"
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: "Dependency scan: machine-readable output (for target-parse check)"
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: json
          output: trivy-results.json

      - name: "Gate 2: fail if trivy resolved zero targets (scanner may be blind)"
        if: always()
        run: python scripts/check_trivy_targets.py trivy-results.json

      - name: "Gate 1: fail build if HIGH/CRITICAL vulnerabilities were found"
        if: always()
        run: |
          if [ "${{ steps.trivy.outcome }}" = "failure" ]; then
            echo "::error::trivy found HIGH/CRITICAL vulnerabilities -- see the 'Dependency scan: HIGH/CRITICAL vulnerabilities' step log above for the CVE table. Failing the build."
            exit 1
          fi
          echo "Gate 1 passed -- no HIGH/CRITICAL vulnerabilities found."
